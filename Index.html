// === HTTPS PROXY PLAYER ===
const PROXY_PREFIX = "https://api.allorigins.win/raw?url="; // fallback public proxy
// ถ้ามี Cloudflare Worker ของตัวเอง ให้เปลี่ยนตรงนี้เป็น https://YOUR_WORKER.workers.dev/?url=
let CUSTOM_PROXY = localStorage.getItem('byteark_proxy') || PROXY_PREFIX;

function toProxyUrl(originalUrl){
  if(!originalUrl) return originalUrl;
  // Already https and not byteark? keep
  if(originalUrl.startsWith('https://') && !originalUrl.includes('byteark')) return originalUrl;
  // For byteark http -> proxy via https
  if(originalUrl.includes('byteark.com')){
    // Ensure we use proxy
    return CUSTOM_PROXY + encodeURIComponent(originalUrl);
  }
  // For relative segment urls inside m3u8, they will be resolved by hls.js to absolute, so we handle in loader
  return originalUrl;
}

// Custom HLS loader that proxies all requests
class ProxyLoader extends Hls.DefaultConfig.loader {
  constructor(config){
    super(config);
    const load = this.load.bind(this);
    this.load = function(context, config, callbacks){
      let url = context.url;
      // If it's byteark http, proxy it
      if(url.includes('byteark.com') && url.startsWith('http://')){
        context.url = toProxyUrl(url);
      }
      // For m3u8 content, we need to rewrite inner segment urls after load
      const origOnSuccess = callbacks.onSuccess;
      callbacks.onSuccess = function(response, stats, context, networkDetails){
        let data = response.data;
        if(typeof data === 'string' && data.includes('#EXTM3U')){
          // This is a playlist, try to make segment urls absolute and keep them http so next load will proxy again
          // We keep them as is, loader will proxy on next request
        }
        // Fix for arraybuffer m3u8 that is actually text
        if(data instanceof ArrayBuffer){
          try{
            let text = new TextDecoder().decode(data);
            if(text.includes('#EXTM3U')){
              response.data = text;
            }
          }catch{}
        }
        origOnSuccess(response, stats, context, networkDetails);
      };
      load(context, config, callbacks);
    };
  }
}

<div id="proxy-ui" style="position:fixed;top:10px;right:10px;z-index:9999;background:#111;color:#fff;padding:12px;border-radius:12px;font-family:Kanit,sans-serif;font-size:12px;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,0.3)">
<div style="font-weight:600;margin-bottom:6px">🔒 โหมด HTTPS Proxy</div>
<div style="opacity:0.8;line-height:1.4;margin-bottom:8px">เล่นได้บน HTTPS แล้ว ผ่าน Proxy ฟรี ถ้าช้ากดเปลี่ยน Proxy ได้</div>
<input id="proxy-input" placeholder="https://YOUR_WORKER.workers.dev/?url=" style="width:100%;background:#222;color:#fff;border:1px solid #333;border-radius:6px;padding:6px 8px;font-size:11px;margin-bottom:6px">
<button id="proxy-save" style="width:100%;background:#fff;color:#000;padding:6px;border-radius:6px;font-weight:600">บันทึก Proxy</button>
<div id="proxy-status" style="margin-top:6px;font-size:11px;opacity:0.7"></div>
</div>
<script>
document.getElementById('proxy-save').onclick = ()=>{
  let v = document.getElementById('proxy-input').value.trim();
  if(v){
    localStorage.setItem('byteark_proxy', v);
    document.getElementById('proxy-status').textContent = 'บันทึกแล้ว รีเฟรชแล้วลองเล่นใหม่';
    setTimeout(()=>location.reload(), 800);
  }
};
document.getElementById('proxy-input').value = localStorage.getItem('byteark_proxy') || '';
